[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bone-age-vision"
version = "0.1.0"
description = "Deep-learning bone age assessment with YOLOv5 localization and RUS-CHN scoring"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23.5,<3",
    "Pillow>=10.3",
    "torch>=2.2",
    "torchvision>=0.17",
    "opencv-python>=4.6",
    "PyYAML>=5.3.1",
    "requests>=2.32.2",
    "scipy>=1.4.1",
    "matplotlib>=3.3",
    "pandas>=1.1.4",
    "seaborn>=0.11",
    "psutil>=5.9",
    "packaging>=23",
    "setuptools>=70",
    "ultralytics-thop>=2.2.1",
    "ultralytics>=8.4.164",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.7",
]

[project.scripts]
bone-age-vision = "bone_age_vision.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
