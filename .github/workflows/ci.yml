name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install lightweight quality dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools>=70" wheel "numpy>=1.23.5,<3" pytest ruff
          pip install --no-deps -e .
      - name: Compile
        run: python -m compileall -q src
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest
