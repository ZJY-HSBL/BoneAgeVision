name: Release

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: write

jobs:
  publish:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Read project version
        id: version
        shell: bash
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Check for existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Build versioned packages
        if: steps.existing.outputs.publish == 'true'
        shell: bash
        run: |
          python -m pip install --upgrade build
          python -m build --sdist --wheel --outdir dist
          TAG="${{ steps.version.outputs.tag }}"
          git archive --format=zip --prefix="BoneAgeVision-${TAG}/" \
            --output="dist/BoneAgeVision-${TAG}-source.zip" HEAD
          cd dist
          sha256sum *.whl *.tar.gz *.zip > SHA256SUMS.txt
      - name: Publish GitHub Release
        if: steps.existing.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          cat > /tmp/RELEASE_NOTES.md <<'NOTES'
          ## BoneAgeVision

          Versioned source archive and Python installation packages for the bone-age assessment application.
          本版本提供 BoneAgeVision 项目的源码压缩包与 Python 安装包。

          Model weights are not included in the source packages and must be supplied separately.
          模型权重不包含在源码安装包中，需要另外提供。

          Installation and usage / 安装及使用：见仓库 README。
          NOTES
          gh release create "$TAG" dist/*.whl dist/*.tar.gz dist/*.zip dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "BoneAgeVision $TAG" \
            --notes-file /tmp/RELEASE_NOTES.md
